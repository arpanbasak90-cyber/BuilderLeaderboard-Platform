<svg width="600" height="150" viewBox="0 0 600 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="logo-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadow-full" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Emblem Icon -->
  <g transform="translate(15, 15)">
    <path d="M60 8 L105 30 V75 L60 112 L15 75 V30 Z" fill="url(#logo-bg)" filter="url(#shadow-full)" />
    <path d="M60 12 L101 32 V73 L60 108 L19 73 V32 Z" fill="none" stroke="white" stroke-opacity="0.25" stroke-width="2" />

    <rect x="34" y="60" width="11" height="25" rx="3" fill="white" fill-opacity="0.5" />
    <rect x="54" y="42" width="11" height="43" rx="3" fill="white" fill-opacity="0.9" />
    <rect x="74" y="52" width="11" height="33" rx="3" fill="white" fill-opacity="0.75" />

    <path d="M60 20 L62.8 27 L70 27 L64.1 31.2 L66.3 38.5 L60 34.2 L53.7 38.5 L55.9 31.2 L50 27 L57.2 27 Z" fill="url(#logo-star)" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />
  </g>

  <!-- Brand Title Typography -->
  <text x="155" y="82" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1.5" fill="#0F172A">Builder</text>
  <text x="325" y="82" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1.5" fill="url(#text-grad)">Board</text>
  
  <!-- Subtitle Tagline -->
  <text x="157" y="112" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="2" fill="#64748B">STELLAR BUILDER PLATFORM</text>
</svg>
