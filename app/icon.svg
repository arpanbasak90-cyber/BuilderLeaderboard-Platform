<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#glowGrad)" />

  <!-- Leaderboard Columns (Podium/Bars) -->
  <g filter="url(#shadow)">
    <rect x="110" y="280" width="60" height="120" rx="12" fill="#ffffff" opacity="0.35" />
    <rect x="226" y="210" width="60" height="190" rx="12" fill="#ffffff" opacity="0.55" />
    <rect x="342" y="140" width="60" height="260" rx="12" fill="#ffffff" opacity="0.75" />

    <!-- Lightning Bolt / Star of Stellar -->
    <path d="M275 80L140 260H250L200 420L380 210H265L275 80Z" fill="#ffffff" stroke="#6366f1" stroke-width="8" stroke-linejoin="round" />
  </g>
</svg>
